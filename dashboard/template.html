<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Card Review Classifier — Results</title>
<style>
/* ============================================================
   THEME — the whole page is colored from this one block.
   Edit these values to recolor every chart, chip, and surface.
   Heatmap cells pick whichever of --ink, --on-fill and --surface
   reads best on their own fill, so keep those three well apart.
   ============================================================ */
:root {
  color-scheme: light;    /* set to "dark" when the palette below is dark, so form controls follow */
  --paper:      #f4f1ea;  /* page background */
  --surface:    #fffdf8;  /* cards */
  --surface-2:  #f0ece2;  /* tracks, empty cells, hovered rows */
  --ink:        #1c1a16;  /* primary text */
  --ink-2:      #514d44;  /* secondary text */
  --ink-3:      #857f73;  /* muted labels */
  --rule:       #e3ddd0;  /* hairlines */
  --axis:       #c8c1b1;  /* baselines */
  --on-fill:    #ffffff;  /* text on dark fills */

  /* sentiment classes (identity) */
  --pos:        #2f5aa8;
  --neu:        #8f8a7e;
  --neg:        #c8502e;
  --unparsed:   #6e56b8;

  /* right vs wrong (the model's result): quiet slate for right, amber so mistakes stand out */
  --hit:        #3e4a57;
  --miss:       #d9822b;

  /* two emotion readers: the model vs the NRC word list */
  --llm:        #7a5195;
  --lex:        #b08a3e;

  /* the stars' own count, drawn as a neutral reference bar */
  --ref:        #b9b2a3;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}

* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 32px; }
b, strong { font-weight: 650; }
[hidden] { display: none !important; }

/* ---------- masthead ---------- */
.masthead { background: var(--surface); border-bottom: 1px solid var(--rule); padding-block: 28px 0; }
.eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 680; letter-spacing: -0.015em; }
.run-tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 22px; }
.run-tab {
  font: inherit; font-size: 14px; color: var(--ink-2); background: transparent; border: 0;
  padding: 10px 14px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.run-tab:hover { color: var(--ink); }
.run-tab[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }
.run-tab:focus-visible { outline: 2px solid var(--pos); outline-offset: -2px; }

/* ---------- layout ---------- */
main { padding-block: 28px 64px; }
section { margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px 28px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 18px; }
h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 680; letter-spacing: -0.005em; }
.h3 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
.sub { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 70ch; }
.grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; }
/* Grid children default to min-width:auto, which lets a wide child stretch its column past the
   screen; 0 lets the child's own scroll wrapper take the overflow instead. */
.grid-2 > *, .verdict > *, .emo-grid > *, .describe-grid > * { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.footnote { margin: 14px 0 0; font-size: 12.5px; color: var(--ink-3); }

/* ---------- verdict ---------- */
.run-blurb { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); max-width: 90ch; }
.verdict { display: grid; grid-template-columns: minmax(260px, 0.9fr) 2fr; gap: 36px; align-items: start; }
.kicker { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-2); }
.hero-value { display: block; font-size: 68px; line-height: 1; font-weight: 680; letter-spacing: -0.035em; }
.hero-sub { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.verdict-head { font-size: 21px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px; }
.verdict-line { margin: 0 0 20px; font-size: 15px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; }
.tile-label { font-size: 12.5px; color: var(--ink-2); }
.tile-value { display: block; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; }
.tile-note { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.mixline { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); }
/* Must come after the base .verdict / .grid-2 rules: equal specificity, so the later rule wins. */
@media (max-width: 960px) { .grid-2, .verdict { grid-template-columns: minmax(0, 1fr); } }

/* ---------- bars shared by every chart ---------- */
.htrack { min-width: 0; }
.bar { height: 12px; min-width: 2px; min-height: 2px; background: var(--c); border-radius: 0 4px 4px 0; }
.v { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.zero-v { color: var(--ink-3); }

/* ---------- descriptive layer ---------- */
.describe-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px; }
@media (max-width: 1000px) { .describe-grid { grid-template-columns: minmax(0, 1fr); } }
.class-block { grid-column: 1 / -1; border-top: 1px solid var(--rule); padding-top: 20px; }
/* Fixed label columns: every track in both star charts has the same width, so bar length means the same share. */
.starbars { display: grid; grid-template-columns: 30px minmax(0, 1fr) 7.5ch 6ch; gap: 7px 10px; align-items: center; font-size: 12.5px; margin-top: 12px; }
.starbars .name { color: var(--ink-2); }
.starbars .pct { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.grouped { margin-top: 12px; }
.group-row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); }
.group-row:first-child { border-top: 0; }
/* Same columns for the Stars line and the Model line, so both bars in a pair share one track width. */
.gbar { display: grid; grid-template-columns: 40px minmax(0, 1fr) 3.5ch 15ch; gap: 8px; align-items: center; font-size: 12.5px; margin: 2px 0; }
.gbar .who { color: var(--ink-3); font-size: 11.5px; }
.gbar .detail { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.split { display: flex; gap: 2px; height: 12px; }
.split .seg { height: 100%; }
.split .seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }

/* ---------- confusion heatmap ---------- */
.cm { display: grid; gap: 2px; }
.cm-corner, .cm-colhead, .cm-rowhead { font-size: 12.5px; color: var(--ink-2); }
.cm-colhead { text-align: center; padding: 0 4px 6px; }
.cm-rowhead { display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
.cm-rowhead small { color: var(--ink-3); font-size: 11.5px; }
.cm-axis { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.cell {
  min-height: 78px; border-radius: 6px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: var(--surface-2); color: var(--ink);
}
.cell.dark { color: var(--on-fill); }
.cell.on-surface { color: var(--surface); }
.cell .count { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.cell .share { font-size: 12px; }
.cell.zero .count { color: var(--ink-2); font-weight: 500; }
.cell.clickable { cursor: pointer; }
.cell.clickable:hover { filter: brightness(0.94); }

/* ---------- per-class correctness ---------- */
.cbar { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
.cbar:first-of-type { border-top: 0; }
.cbar .track { display: flex; gap: 2px; height: 18px; }
.seg { height: 100%; min-width: 2px; min-height: 2px; background: var(--c); flex-basis: 0; }
.cbar .seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.cbar-text { grid-column: 2; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cbar-text b { color: var(--ink); }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.result { font-size: 12px; font-weight: 600; white-space: nowrap; }
.result .mark { display: inline-block; width: 16px; text-align: center; color: var(--c); font-weight: 800; }

/* ---------- review table ---------- */
.count-line { font-size: 13.5px; color: var(--ink-2); }
.count-line b { color: var(--ink); }
.table-wrap { max-height: 640px; overflow: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.is-miss td { background: color-mix(in srgb, var(--miss) 6%, var(--surface)); }
tbody tr.is-miss:hover td { background: color-mix(in srgb, var(--miss) 11%, var(--surface)); }
td.review { min-width: 320px; }
td.review .t { font-weight: 600; color: var(--ink); -webkit-line-clamp: 1; }
td.review .x { color: var(--ink-2); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
tr.expanded .clamp { display: block; -webkit-line-clamp: unset; }
.hits { display: none; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
tr.expanded .hits { display: block; }
td.emo { font-size: 12.5px; color: var(--ink); white-space: nowrap; }
td.emo small { display: block; color: var(--ink-3); font-size: 11.5px; white-space: normal; max-width: 22ch; }
.empty { padding: 28px; text-align: center; color: var(--ink-2); margin: 0; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 16px; padding: 14px 16px; margin-bottom: 14px; background: var(--surface-2); border-radius: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field.grow { flex: 1 1 240px; }
.field select, .field input {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 7px 10px; min-height: 36px;
}
.reset {
  font: inherit; font-size: 14px; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--axis); border-radius: 6px; padding: 7px 14px; min-height: 36px;
}
.reset:hover { background: var(--surface); }
.field select:focus-visible, .field input:focus-visible, .reset:focus-visible { outline: 2px solid var(--pos); outline-offset: 1px; }

/* ---------- emotion ---------- */
.emo-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
@media (max-width: 720px) { .emo-tiles, .tiles { grid-template-columns: 1fr; } }
.emo-context { margin: -8px 0 24px; font-size: 13.5px; color: var(--ink-2); max-width: 100ch; }
.emo-grid { display: grid; grid-template-columns: minmax(300px, 0.8fr) 1.2fr; gap: 32px; align-items: start; }
@media (max-width: 1000px) { .emo-grid { grid-template-columns: minmax(0, 1fr); } }
/* Fixed value columns keep both readers' bars on one track width. */
.pairbars { display: grid; grid-template-columns: 96px minmax(0, 1fr) 3ch minmax(0, 1fr) 3ch; gap: 7px 10px; align-items: center; font-size: 12.5px; margin-top: 12px; }
.pairbars .head { color: var(--ink-3); font-size: 11.5px; grid-column: span 2; }
.pairbars .name { color: var(--ink-2); }
.pairbars .na { color: var(--ink-3); }
.xt-wrap { overflow-x: auto; }
.xt { display: grid; gap: 2px; margin-top: 12px; min-width: 560px; }
.xt-head { font-size: 11px; color: var(--ink-2); text-align: center; padding-bottom: 4px; white-space: nowrap; line-height: 1.2; align-self: end; }
.xt-rowhead { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; }
.xt .cell { min-height: 32px; border-radius: 4px; }
.xt .cell .count { font-size: 13px; font-weight: 600; letter-spacing: 0; }

/* ---------- method ---------- */
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 28px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--ink-3); }
.facts dd { margin: 2px 0 0; font-size: 13.5px; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 10; pointer-events: none; max-width: 260px;
  background: var(--ink); color: var(--surface); border-radius: 6px; padding: 7px 10px;
  font-size: 12.5px; line-height: 1.35; opacity: 0; transform: translateY(4px); transition: opacity .08s, transform .08s;
}
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; font-size: 15px; }
[data-value]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- narrow screens ---------- */
@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .card { padding: 18px 16px; }
  h1 { font-size: 24px; }
  .run-tabs { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; }
  .hero-value { font-size: 52px; }
  .gbar { grid-template-columns: 40px minmax(0, 1fr) 3.5ch; }
  .gbar .detail { grid-column: 2 / -1; white-space: normal; }
  .pairbars { grid-template-columns: 70px minmax(0, 1fr) 3ch minmax(0, 1fr) 3ch; gap: 6px 6px; }
  .cm { grid-template-columns: 84px repeat(var(--cm-cols), minmax(56px, 1fr)) !important; }
  /* One card per review: the title and text are the point, so they must not sit behind a sideways scroll. */
  .table-wrap { max-height: none; }
  #review-table, #review-table tbody { display: block; }
  #review-table thead { display: none; }
  #review-table tr { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; padding: 12px; border-bottom: 1px solid var(--rule); }
  #review-table td { display: block; padding: 0; border: 0; background: none !important; }
  #review-table td.num:first-child { display: none; }
  #review-table td.review { grid-column: 1 / -1; min-width: 0; }
  #review-table td.emo { grid-column: span 1; }
  tbody tr.is-miss { background: color-mix(in srgb, var(--miss) 6%, var(--surface)); }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">MBAX 6418 · Assignment 1 · Amazon Reviews '23, Gift Cards</p>
    <h1 id="page-title"></h1>
    <nav class="run-tabs" id="run-tabs" role="tablist" aria-label="Choose a run"></nav>
  </div>
</header>

<main class="wrap">
  <p class="run-blurb" id="run-blurb"></p>

  <section class="card" id="sec-verdict" aria-labelledby="verdict-head"></section>

  <section class="card" id="sec-describe" aria-labelledby="describe-title"></section>

  <div class="grid-2">
    <section class="card" id="sec-confusion" aria-labelledby="cm-title"></section>
    <section class="card" id="sec-classes" aria-labelledby="classes-title"></section>
  </div>

  <section class="card" id="sec-emotion" aria-labelledby="emo-title" hidden></section>

  <section class="card" id="sec-reviews" aria-labelledby="reviews-title"></section>

  <section class="card" id="sec-method" aria-labelledby="method-title"></section>
</main>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);

  /* ---------- display rules (verify_dashboard.py mirrors these) ---------- */
  const FORMAT = {
    pct:   v => (v * 100).toFixed(1) + "%",
    count: v => Math.round(v).toLocaleString("en-US"),
    pp:    v => (v < 0 ? "−" : "+") + Math.abs(v * 100).toFixed(1) + " pts",
    dec2:  v => v.toFixed(2),
    text:  v => String(v),
  };
  const CLASS_VAR = { POSITIVE: "--pos", NEUTRAL: "--neu", NEGATIVE: "--neg", UNPARSED: "--unparsed" };
  const nice = s => s.charAt(0) + s.slice(1).toLowerCase();
  const colorOf = k => `var(${CLASS_VAR[k] || "--ink-3"})`;

  /* ---------- DOM helpers: all data text goes in via textContent ---------- */
  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null) continue;
      if (k === "class") n.className = v;
      else if (k === "style") n.style.cssText = v;
      else n.setAttribute(k, v);
    }
    for (const c of children.flat(Infinity)) {
      if (c === undefined || c === null || c === false) continue;
      n.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return n;
  }
  const $ = id => document.getElementById(id);
  // Every section is filled through this, so a null/false child can never print as text.
  const fill = (id, ...children) => $(id).replaceChildren(el("div", { class: "section-body" }, ...children));

  // Review text in the dataset carries HTML line breaks and entities (e.g. "<br />", "&#34;").
  // For reading only, show them as line breaks and characters; still inserted as plain text.
  const ENTITIES = { amp: "&", lt: "<", gt: ">", quot: "\"", apos: "'", nbsp: " " };
  function displayText(s) {
    return String(s).replace(/<br\s*\/?>/gi, "\n").replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e) => {
      try {
        if (e[0] !== "#") return ENTITIES[e.toLowerCase()] ?? m;
        return String.fromCodePoint(e[1].toLowerCase() === "x" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
      } catch (_) { return m; }
    });
  }
  const getPath = (obj, path) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);

  // A metric number: carries its raw value and the file#field it came from.
  function metric(obj, file, path, format, run, cls) {
    const v = getPath(obj, path);
    if (v === undefined) throw new Error("missing field " + file + "#" + path);
    return el("span", {
      class: cls || "num", "data-metric": path, "data-raw": JSON.stringify(v),
      "data-source": file + "#" + path, "data-format": format, "data-run": run,
    }, FORMAT[format](v));
  }
  const M = (run, path, format, cls) => metric(run.metrics, run.sources.metrics, path, format, run.run, cls);
  const META = (run, path, format, cls) => metric(run.meta, run.sources.meta, path, format, run.run, cls);
  const CMP = (run, path, format, cls) => metric(DATA.comparisons, DATA.comparisons_source, path, format, run.run, cls);
  const hasCmp = path => !!DATA.comparisons && getPath(DATA.comparisons, path) !== undefined;

  // A chart mark: carries run, metric path, value, a human label, an accessible name, and — where the
  // bar is sized directly — the fraction of its track it should occupy, so the length can be verified.
  function mark(runName, path, value, label, cls, style, scale, frac) {
    return el("div", {
      class: cls, style, tabindex: "0", role: "img", "aria-label": `${label}: ${Number(value).toLocaleString("en-US")}`,
      "data-run": runName, "data-metric": path, "data-value": String(value), "data-label": label,
      "data-scale": scale, "data-frac": frac === undefined ? null : String(frac),
    });
  }

  // Heatmap text color from the cell's actual fill, so any :root palette stays readable.
  const inkCtx = document.createElement("canvas").getContext("2d");
  function toRgb(color) {
    inkCtx.clearRect(0, 0, 1, 1); inkCtx.fillStyle = "#000"; inkCtx.fillStyle = color; inkCtx.fillRect(0, 0, 1, 1);
    return [...inkCtx.getImageData(0, 0, 1, 1).data.slice(0, 3)];
  }
  const luminance = rgb => rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
    .reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0);
  const contrast = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
  const CELL_INK = [["", "--ink"], ["dark", "--on-fill"], ["on-surface", "--surface"]];
  function inkCells(root) {
    const style = getComputedStyle(document.documentElement);
    const options = CELL_INK.map(([cls, token]) => [cls, luminance(toRgb(style.getPropertyValue(token).trim()))]);
    for (const c of root.querySelectorAll(".cell")) {
      const bg = luminance(toRgb(getComputedStyle(c).backgroundColor));
      const best = options.reduce((a, b) => contrast(bg, b[1]) > contrast(bg, a[1]) ? b : a);
      c.classList.remove("dark", "on-surface");
      if (best[0]) c.classList.add(best[0]);
    }
  }
  // Fill strength for a share: light tints below half, deep fills above, skipping the mid-tones where
  // neither dark nor light text is legible.
  const strengthOf = share => share < 0.5 ? Math.round(14 + 62 * share) : Math.round(80 + 40 * (share - 0.5));

  let current = null;

  /* ---------- run tabs ---------- */
  function renderTabs() {
    $("run-tabs").replaceChildren(...DATA.runs.map(r => {
      const b = el("button", {
        class: "run-tab", role: "tab", type: "button", "data-run-tab": r.run,
        "aria-selected": String(r.run === current.run),
      }, r.label);
      b.addEventListener("click", () => selectRun(r.run));
      return b;
    }));
  }

  /* ---------- run description in plain words, built from run_meta.json / metrics.json ---------- */
  const SCHEME_TEXT = {
    binary: "two classes; answer key from the stars: 4–5★ positive, 1–3★ negative",
    three: "three classes; answer key from the stars: 4–5★ positive, 3★ neutral, 1–2★ negative",
  };
  function renderBlurb(run) {
    const m = run.metrics;
    const how = run.meta.selection === "balanced_150"
      ? [M(run, `truth_distribution.counts.${m.labels[0]}`, "count"), " drawn at random from each star class across the whole file (seed ",
         META(run, "seed", "text"), ")"]
      : ["the first ", M(run, "n_rows", "count"), " in the file that have review text"];
    $("run-blurb").replaceChildren(el("span", {},
      META(run, "n_rows", "count"), " reviews: ", how, ". Scored with ", META(run, "prompt_file", "text", "mono"), "; ",
      SCHEME_TEXT[run.meta.label_scheme] || run.meta.label_scheme, ". The exact selection rule is under “How this run was made”."));
  }

  /* ---------- verdict + headline numbers ---------- */
  function renderVerdict(run) {
    const m = run.metrics, labels = m.labels;
    const weakest = labels.slice().sort((a, b) =>
      m.per_class[a].recall - m.per_class[b].recall || labels.indexOf(a) - labels.indexOf(b))[0];
    const smallest = labels.slice().sort((a, b) => m.per_class[a].support - m.per_class[b].support)[0];
    // On a balanced sample every class is equally common; naming one would imply a choice that isn't there.
    const topCount = Math.max(...labels.map(l => m.truth_distribution.counts[l]));
    const tiedMajority = labels.filter(l => m.truth_distribution.counts[l] === topCount).length > 1;
    const shortcut = tiedMajority ? "any one class" : "“" + nice(m.majority_class) + "”";
    // The run's largest mistake as a share of its own class, so a big class cannot crowd out a small one.
    const mistakes = labels.flatMap(t => m.confusion_matrix.columns.filter(c => c !== t)
      .map(c => ({ t, c, n: m.confusion_cells[`${t}->${c}`], s: m.confusion_row_share[`${t}->${c}`] || 0 })))
      .filter(x => x.n > 0).sort((a, b) => b.s - a.s || b.n - a.n);
    const top = mistakes[0];
    const wilson = `${run.run}_accuracy_wilson95`, vs = `${run.run}_vs_majority`;
    // Intervals belong to the run that was actually sampled at random; the first-100 runs are a file-order slice.
    const showInterval = run.meta.selection === "balanced_150" && hasCmp(`${wilson}.0`);

    const hero = el("div", {},
      el("p", { class: "kicker" }, "Agreement with the star rating"),
      M(run, "accuracy", "pct", "hero-value"),
      el("p", { class: "hero-sub" }, M(run, "correct", "count"), " of ", M(run, "n_rows", "count"), " reviews match the answer key."),
      showInterval && el("p", { class: "hero-sub" }, "Likely range for the underlying agreement rate: ",
        CMP(run, `${wilson}.0`, "pct"), " to ", CMP(run, `${wilson}.1`, "pct"),
        " (Wilson interval, ", CMP(run, "interval_confidence", "pct"), " confidence)."),
      el("p", { class: "hero-sub" }, "Unreadable model replies: ", M(run, "unparsed_count", "count"), " (counted as wrong)."));

    const body = el("div", {},
      el("h2", { class: "verdict-head", id: "verdict-head" },
        "The model matches the stars on ", M(run, "accuracy", "pct"), " of these reviews. ",
        "Answering ", shortcut, " every time would score ", M(run, "majority_baseline_accuracy", "pct"), "."),
      el("p", { class: "verdict-line" },
        // On an equal-mix sample the shortcut is set by the sampling, so a margin over it is not comparable across runs.
        tiedMajority
          ? "Every class is the same size in this sample, so that shortcut reflects the sample's forced mix, not real reviews. "
          : hasCmp(`${vs}_model_only_right`)
            ? ["Against that shortcut the model gets ", CMP(run, `${vs}_model_only_right`, "count"),
               " reviews right that it would miss, and misses ", CMP(run, `${vs}_shortcut_only_right`, "count"),
               " that it would get; an exact test puts the chance of a gap this size at p = ",
               CMP(run, `${vs}_exact_mcnemar_p`, "dec2"), " (above 0.05 means a gap this size is common by chance). "]
            : ["Reading the reviews is worth ", M(run, "accuracy_minus_majority_baseline", "pp"), " over that shortcut. "],
        top && ["Largest mistake as a share of its class: ", el("b", {}, nice(top.t)), " reviews answered ", el("b", {}, nice(top.c)), ", ",
          M(run, `confusion_cells.${top.t}->${top.c}`, "count"), " of ", M(run, `per_class.${top.t}.support`, "count"),
          " (", M(run, `confusion_row_share.${top.t}->${top.c}`, "pct"), "). "],
        "Weakest class: ", el("b", {}, nice(weakest)), ", ",
        M(run, `per_class.${weakest}.correct`, "count"), " of ", M(run, `per_class.${weakest}.support`, "count"), " right (",
        M(run, `per_class.${weakest}.recall`, "pct"), ")",
        m.per_class[weakest].support < 10 ? ["; with only ", M(run, `per_class.${weakest}.support`, "count"),
          " reviews in that class, one review moves this rate a lot."] : "."),
      el("div", { class: "tiles" },
        el("div", { class: "tile" },
          el("div", { class: "tile-label" }, tiedMajority ? "Always-one-class baseline" : "Always-“" + nice(m.majority_class) + "” baseline"),
          M(run, "majority_baseline_accuracy", "pct", "tile-value"),
          el("div", { class: "tile-note" }, tiedMajority ? "every class is the same size here" : "share of the most common class")),
        el("div", { class: "tile" },
          el("div", { class: "tile-label" }, "Balanced accuracy"),
          M(run, "balanced_accuracy", "pct", "tile-value"),
          el("div", { class: "tile-note" }, "average hit rate per class; smallest class ",
            M(run, `per_class.${smallest}.support`, "count"), " reviews; baseline ", M(run, "majority_baseline_balanced_accuracy", "pct"))),
        el("div", { class: "tile" },
          el("div", { class: "tile-label" }, "Macro F1"),
          M(run, "macro_f1", "pct", "tile-value"),
          el("div", { class: "tile-note" }, "precision and recall, classes weighted equally"))));

    const mixline = el("p", { class: "mixline" }, "Answer key in this run: ",
      labels.map((k, i) => [i ? " · " : "", el("span", { class: "key", style: `--c:${colorOf(k)}` }), nice(k), " ",
        M(run, `truth_distribution.counts.${k}`, "count"), " (", M(run, `truth_distribution.share.${k}`, "pct"), ")"]),
      ". The model's answers per class are compared just below.");

    fill("sec-verdict", el("div", { class: "verdict" }, hero, body), mixline);
  }

  /* ---------- descriptive layer: stars in the file vs this sample; answer key vs model per class ---------- */
  function renderDescribe(run) {
    const m = run.metrics, dist = DATA.rating_distribution;
    const F = (path, format, cls) => metric(dist, DATA.rating_distribution_source, path, format, "__file__", cls);
    const S = (path, format, cls) => M(run, path, format, cls);
    const STARS = ["5", "4", "3", "2", "1"];

    // Star distribution as shares on one 0-100% scale; fixed label columns make every track the same width.
    const starChart = (who, markRun, countPath, sharePath, span, counts, shares) => el("div", { class: "starbars" },
      STARS.map(s => {
        const v = counts[s];
        const track = el("div", { class: "htrack" }, v > 0 && mark(markRun, `${countPath}.${s}`, v, `${who}: ${s}★`, "bar",
          `width:${(100 * shares[s]).toFixed(2)}%; --c:var(--ink-2)`, "star-share", shares[s]));
        return [el("span", { class: "name" }, s + "★"), track,
          span(`${countPath}.${s}`, "count", "v" + (v ? "" : " zero-v")), el("span", { class: "pct" }, span(`${sharePath}.${s}`, "pct"))];
      }));

    const fileBlock = el("div", {},
      el("p", { class: "h3" }, "Stars in the whole file"),
      el("p", { class: "sub" }, F("row_count", "count"), " reviews in the Gift Cards file."),
      starChart("Whole file", "__file__", "rating_counts", "rating_share", F, dist.rating_counts, dist.rating_share));
    const sampleBlock = el("div", {},
      el("p", { class: "h3" }, "Stars in this run's sample"),
      el("p", { class: "sub" }, S("n_rows", "count"), " reviews scored in this run."),
      starChart("This sample", run.run, "sample_rating_counts", "sample_rating_share", S, m.sample_rating_counts, m.sample_rating_share));

    // The stars' count per class, and the model's answers for that class split into right and wrong.
    const cols = m.confusion_matrix.columns.filter(c => m.labels.includes(c) || m.prediction_distribution.counts[c] > 0);
    const maxC = Math.max(1, ...cols.map(c => Math.max(m.truth_distribution.counts[c] || 0, m.prediction_distribution.counts[c] || 0)));
    const starsLine = c => {
      const v = m.truth_distribution.counts[c];
      if (v === undefined) return el("div", { class: "gbar" }, el("span", { class: "who" }, "Stars"),
        el("span", { class: "detail" }, "not a star class"), el("span", {}), el("span", {}));
      return el("div", { class: "gbar" }, el("span", { class: "who" }, "Stars"),
        el("div", { class: "htrack" }, v > 0 && mark(run.run, `truth_distribution.counts.${c}`, v, `Stars · ${nice(c)}`, "bar",
          `width:${(100 * v / maxC).toFixed(2)}%; --c:var(--ref)`, "class-counts", v / maxC)),
        S(`truth_distribution.counts.${c}`, "count", "v"), el("span", {}));
    };
    const modelLine = c => {
      const total = m.prediction_distribution.counts[c], pc = m.per_class[c];
      const segs = pc ? [pc.correct, pc.predicted_wrong].filter(v => v > 0).length : (total > 0 ? 1 : 0);
      // The split box is itself a mark: its own length carries the class total, and its segments carry
      // right vs wrong, so a wrong length is caught at either level.
      const split = mark(run.run, `prediction_distribution.counts.${c}`, total, `Model said ${nice(c)}`, "split",
        `width:${(100 * total / maxC).toFixed(2)}%; min-width:${segs * 2 + (segs - 1) * 2}px`, "class-counts", total / maxC);
      split.append(...(pc
        ? [pc.correct > 0 && mark(run.run, `per_class.${c}.correct`, pc.correct, `Model said ${nice(c)}, right`, "seg",
             `flex-grow:${pc.correct}; --c:var(--hit)`),
           pc.predicted_wrong > 0 && mark(run.run, `per_class.${c}.predicted_wrong`, pc.predicted_wrong, `Model said ${nice(c)}, wrong`, "seg",
             `flex-grow:${pc.predicted_wrong}; --c:var(--miss)`)]
        : [el("div", { class: "seg", style: "flex-grow:1; --c:var(--miss)" })]).filter(Boolean));
      return el("div", { class: "gbar" }, el("span", { class: "who" }, "Model"),
        el("div", { class: "htrack" }, total > 0 && split),
        S(`prediction_distribution.counts.${c}`, "count", "v"),
        el("span", { class: "detail" }, pc
          ? [S(`per_class.${c}.correct`, "count"), " right · ", S(`per_class.${c}.predicted_wrong`, "count"), " wrong"]
          : "all wrong"));
    };
    const classBlock = el("div", { class: "class-block" },
      el("p", { class: "h3" }, "Stars' answer vs the model's answer, per class"),
      el("p", { class: "sub" }, "Upper bar: reviews the stars put in the class. Lower bar: reviews the model put there, split into right and wrong answers, since matching totals can still hide wrong answers."),
      el("div", { class: "grouped" }, cols.map(c => el("div", { class: "group-row" },
        el("span", { class: "chip", style: `--c:${colorOf(c)}` }, nice(c)), el("div", {}, starsLine(c), modelLine(c))))),
      el("div", { class: "legend", style: "margin-top:10px" },
        el("span", {}, el("span", { class: "key", style: "--c:var(--ref)" }), "Stars' count"),
        el("span", {}, el("span", { class: "key", style: "--c:var(--hit)" }), "Model right"),
        el("span", {}, el("span", { class: "key", style: "--c:var(--miss)" }), "Model wrong")));

    fill("sec-describe",
      el("div", { class: "sec-head" }, el("div", {},
        el("h2", { id: "describe-title" }, "What was scored, and what the model answered"),
        el("p", { class: "sub" }, "The star mix of the whole file next to this run's sample, and for each class how many reviews the stars assign versus how many the model assigned."))),
      el("div", { class: "describe-grid" }, fileBlock, sampleBlock, classBlock));
  }

  /* ---------- confusion matrix heatmap ---------- */
  function renderConfusion(run) {
    const m = run.metrics, rows = m.confusion_matrix.rows;
    const cols = m.confusion_matrix.columns.filter(c => rows.includes(c) || m.prediction_distribution.counts[c] > 0);
    const grid = el("div", { class: "cm", role: "table", "aria-label": "Confusion matrix, rows are the answer key, columns are the model's prediction",
      style: `grid-template-columns: 118px repeat(${cols.length}, minmax(64px, 1fr)); --cm-cols: ${cols.length}` });
    grid.append(el("div", { class: "cm-corner cm-axis" }, "Stars say ↓ / model says →"));
    for (const c of cols) grid.append(el("div", { class: "cm-colhead", role: "columnheader" },
      el("span", { class: "chip", style: `--c:${colorOf(c)}` }, nice(c))));
    for (const r of rows) {
      grid.append(el("div", { class: "cm-rowhead", role: "rowheader" },
        el("span", { class: "chip", style: `--c:${colorOf(r)}` }, nice(r)),
        el("small", {}, M(run, `per_class.${r}.support`, "count"), " reviews")));
      for (const c of cols) {
        const cellKey = `${r}->${c}`;
        const n = m.confusion_cells[cellKey], share = m.confusion_row_share[cellKey] || 0;
        const style = n ? `background: color-mix(in srgb, var(${r === c ? "--hit" : "--miss"}) ${strengthOf(share)}%, var(--surface))` : "";
        const cell = mark(run.run, `confusion_cells.${cellKey}`, n, `Stars: ${nice(r)} → model: ${nice(c)}`, "cell" + (n ? "" : " zero"), style);
        cell.setAttribute("role", "cell");
        if (n) {
          cell.classList.add("clickable");
          cell.title = "Show these reviews in the table";
          cell.addEventListener("click", () => filterTo(r, c));
          cell.addEventListener("keydown", e => { if (e.key === "Enter") filterTo(r, c); });
        }
        cell.append(M(run, `confusion_cells.${cellKey}`, "count", "count"),
          el("span", { class: "share" }, M(run, `confusion_row_share.${cellKey}`, "pct"), " of row"));
        grid.append(cell);
      }
    }
    const neutralRange = `${run.run}_neutral_to_negative_share_wilson95`, neutralRecall = `${run.run}_neutral_recall_wilson95`;
    fill("sec-confusion",
      el("div", { class: "sec-head" }, el("div", {},
        el("h2", { id: "cm-title" }, "Where the answers land"),
        el("p", { class: "sub" }, "Confusion matrix. Rows are the answer key from the stars; columns are the model's prediction. The diagonal holds right answers and every other cell is a mistake (see key); a stronger fill means a bigger share of the row. Click a cell to list those reviews."))),
      grid,
      el("div", { class: "legend", style: "margin-top:14px" },
        el("span", {}, el("span", { class: "key", style: "--c:var(--hit)" }), "Right (diagonal)"),
        el("span", {}, el("span", { class: "key", style: "--c:var(--miss)" }), "Wrong"),
        cols.includes("UNPARSED") && el("span", {}, "Unparsed = the reply could not be read; always wrong")),
      hasCmp(`${neutralRange}.0`) && hasCmp(`${neutralRecall}.0`) && el("p", { class: "footnote" },
        "Likely ranges for the underlying rates, from ", M(run, "per_class.NEUTRAL.support", "count"),
        " neutral reviews (Wilson interval, ", CMP(run, "interval_confidence", "pct"), " confidence): neutral answered negative ",
        CMP(run, `${neutralRange}.0`, "pct"), " to ", CMP(run, `${neutralRange}.1`, "pct"), "; neutral answered right ",
        CMP(run, `${neutralRecall}.0`, "pct"), " to ", CMP(run, `${neutralRecall}.1`, "pct"), "."));
    inkCells($("sec-confusion"));
  }

  /* ---------- per-class correctness ---------- */
  function renderClasses(run) {
    const m = run.metrics;
    const list = el("div", {}, m.labels.map(k => {
      const pc = m.per_class[k];
      const track = el("div", { class: "track" },
        pc.correct > 0 && mark(run.run, `per_class.${k}.correct`, pc.correct, `${nice(k)} reviews answered right`, "seg", `flex-grow:${pc.correct}; --c:var(--hit)`, "right-wrong"),
        pc.wrong > 0 && mark(run.run, `per_class.${k}.wrong`, pc.wrong, `${nice(k)} reviews answered wrong`, "seg", `flex-grow:${pc.wrong}; --c:var(--miss)`, "right-wrong"));
      return el("div", { class: "cbar" },
        el("span", { class: "chip", style: `--c:${colorOf(k)}` }, nice(k)), track,
        el("span", { class: "cbar-text" }, el("b", {}, M(run, `per_class.${k}.correct`, "count")), " of ",
          M(run, `per_class.${k}.support`, "count"), " right · ", el("b", {}, M(run, `per_class.${k}.recall`, "pct")),
          " · ", M(run, `per_class.${k}.wrong`, "count"), " wrong"));
    }));
    const precision = el("p", { class: "footnote" }, "When the model says a class, how often it is right (precision): ",
      m.labels.map((k, i) => [i ? " · " : "", nice(k), " ", M(run, `per_class.${k}.precision`, "pct")]));
    // On a balanced sample precision and accuracy reflect the forced equal mix; show the whole-file re-weighting when saved.
    const popKey = `${run.run}_population_weighted_precision`, lowKey = `${run.run}_population_weighted_accuracy_at_positive_recall_low`;
    const popNote = hasCmp(popKey) && el("p", { class: "footnote" },
      "Each class is a third of this sample. The whole file is ", CMP(run, "population_weights.POSITIVE", "pct"), " positive, ",
      CMP(run, "population_weights.NEUTRAL", "pct"), " neutral and ", CMP(run, "population_weights.NEGATIVE", "pct"),
      " negative. Re-weighted to that mix, precision would be about: ",
      m.labels.map((k, i) => [i ? " · " : "", nice(k), " ", CMP(run, `${popKey}.${k}`, "pct")]),
      ", and accuracy about ", CMP(run, `${run.run}_population_weighted_accuracy`, "pct"),
      ", where always answering positive would score ", CMP(run, "population_weights.POSITIVE", "pct"), " (a rough estimate from this sample).",
      hasCmp(lowKey) && [" That gap rests on positive recall: at the low end of its likely range (",
        CMP(run, `${run.run}_positive_recall_wilson95.0`, "pct"), ") the re-weighted accuracy would be about ",
        CMP(run, lowKey, "pct"), "."]);
    const no4 = m.labels.includes("POSITIVE") && m.sample_rating_counts["4"] === 0 && el("p", { class: "footnote" },
      "Positive here means 5★ reviews only: this sample has ", M(run, "sample_rating_counts.4", "count"), " 4★ reviews.");
    fill("sec-classes",
      el("div", { class: "sec-head" }, el("div", {},
        el("h2", { id: "classes-title" }, "Right answers by class"),
        el("p", { class: "sub" }, "For each answer-key class: how many reviews the model got right (recall). Every bar uses the same full length for its class, and small classes swing on one or two reviews."))),
      list,
      el("div", { class: "legend", style: "margin-top:12px" },
        el("span", {}, el("span", { class: "key", style: "--c:var(--hit)" }), "Right"),
        el("span", {}, el("span", { class: "key", style: "--c:var(--miss)" }), "Wrong")),
      precision, popNote, no4);
  }

  /* ---------- emotion: the model vs the NRC word list ---------- */
  const EMOTIONS = ["anger", "anticipation", "disgust", "fear", "joy", "sadness", "surprise", "trust"];
  const emoName = k => k === "UNPARSED" ? "Unparsed" : k === "TIE" ? "Tie" : k === "NONE" ? "None" : k;

  function renderEmotion(run) {
    const sec = $("sec-emotion"), em = run.emotion_metrics;
    if (!em) { sec.hidden = true; sec.replaceChildren(); return; }
    sec.hidden = false;
    const E = (path, format, cls) => metric(em, run.sources.emotion_metrics, path, format, run.run, cls);
    const showUnparsed = em.llm_emotion_counts.UNPARSED > 0;

    const tile = (label, ratePath, groupPath) => el("div", { class: "tile" },
      el("div", { class: "tile-label" }, label), E(ratePath, "pct", "tile-value"),
      el("div", { class: "tile-note" }, E(groupPath + ".agree", "count"), " of ", E(groupPath + ".n", "count"), " reviews"));
    const tiles = el("div", { class: "emo-tiles" },
      tile("Same emotion, all reviews", "agreement_rate_all_rows", "agreement.all_rows"),
      tile("Leaving out reviews with no lexicon words", "agreement_rate_excluding_none", "agreement.excluding_none"),
      tile("Also leaving out word-list ties", "agreement_rate_excluding_none_and_tie", "agreement.excluding_none_and_tie"));

    // Skew context: what constant answers would score against the same word list, on the same subsets as the tiles.
    const context = el("p", { class: "emo-context" },
      "For scale: answering “", E("constant_baseline_emotion", "text"), "” (the model's most common emotion) for every review would match the word list on ",
      E("constant_baseline_rate_all_rows", "pct"), " of all reviews (", E("constant_baseline.all_rows.agree", "count"), " of ",
      E("constant_baseline.all_rows.n", "count"), ") and on ", E("constant_baseline_rate_excluding_none_and_tie", "pct"),
      " where it has one winner (", E("constant_baseline.excluding_none_and_tie.agree", "count"), " of ",
      E("constant_baseline.excluding_none_and_tie.n", "count"), ").",
      em.best_constant_baseline_emotion !== em.constant_baseline_emotion && [
        " The strongest single constant is “", E("best_constant_baseline_emotion", "text"), "”: ",
        E("best_constant_baseline_rate_all_rows", "pct"), " of all reviews (", E("best_constant_baseline.all_rows.agree", "count"),
        " of ", E("best_constant_baseline.all_rows.n", "count"), ") and ", E("best_constant_baseline_rate_excluding_none_and_tie", "pct"),
        " where the word list has one winner (", E("best_constant_baseline.excluding_none_and_tie.agree", "count"), " of ",
        E("best_constant_baseline.excluding_none_and_tie.n", "count"), ")."],
      " The model itself matches the word list on ", E("agreement_rate_all_rows", "pct"), " of all reviews and ",
      E("agreement_rate_excluding_none_and_tie", "pct"), " where the word list has one winner.",
      " The word list tied on ", E("tie_rows", "count"), " reviews; the model's emotion is among the tied ones in ",
      E("tie_rows_llm_emotion_in_tied_set", "count"), " of them, and “", E("constant_baseline_emotion", "text"), "” is among them in ",
      E("tie_rows_constant_in_tied_set", "count"), ".");

    // Counts per emotion from each reader, on one shared scale (fixed value columns keep tracks equal).
    const keys = [...EMOTIONS, "TIE", "NONE", ...(showUnparsed ? ["UNPARSED"] : [])];
    const max = Math.max(1, ...Object.values(em.llm_emotion_counts), ...Object.values(em.nrc_emotion_counts));
    const bar = (field, key, tone, who) => {
      const v = em[field][key];
      if (v === undefined) return [el("span", { class: "na" }, "—"), el("span", {})];
      return [el("div", { class: "htrack" }, v > 0 && mark(run.run, `emotion.${field}.${key}`, v, `${who}: ${emoName(key)}`, "bar",
          `width:${(100 * v / max).toFixed(2)}%; --c:var(${tone})`, "emotion-counts", v / max)),
        E(`${field}.${key}`, "count", "v" + (v ? "" : " zero-v"))];
    };
    const pair = el("div", { class: "pairbars" },
      el("span", {}), el("span", { class: "head" }, el("span", { class: "key", style: "--c:var(--llm)" }), "Model"),
      el("span", { class: "head" }, el("span", { class: "key", style: "--c:var(--lex)" }), "NRC word list"),
      keys.map(k => [el("span", { class: "name" }, emoName(k)), bar("llm_emotion_counts", k, "--llm", "Model"), bar("nrc_emotion_counts", k, "--lex", "Word list")]));

    // Cross-tab: rows = the model's emotion, columns = the word list's emotion.
    const rows = em.crosstab.rows.filter(r => r !== "UNPARSED" || showUnparsed), cols = em.crosstab.columns;
    const cmax = Math.max(1, ...Object.values(em.crosstab_cells));
    const xt = el("div", { class: "xt", role: "table", "aria-label": "Emotion cross-tab, rows are the model, columns are the word list",
      style: `grid-template-columns: 88px repeat(${cols.length}, minmax(34px, 1fr))` });
    xt.append(el("div", { class: "cm-axis", style: "align-self:end" }, "Model ↓ words →"));
    const SHORT = { anticipation: "anticip." };  // keeps a narrow column header on one line
    for (const c of cols) xt.append(el("div", { class: "xt-head", role: "columnheader", title: emoName(c), "aria-label": emoName(c) }, SHORT[c] || emoName(c)));
    for (const r of rows) {
      xt.append(el("div", { class: "xt-rowhead", role: "rowheader" }, emoName(r)));
      for (const c of cols) {
        const key = `${r}->${c}`, n = em.crosstab_cells[key];
        const cell = mark(run.run, `emotion.crosstab_cells.${key}`, n, `Model: ${emoName(r)} · word list: ${emoName(c)}`,
          "cell" + (n ? "" : " zero"), n ? `background: color-mix(in srgb, var(${r === c ? "--hit" : "--lex"}) ${strengthOf(n / cmax)}%, var(--surface))` : "");
        cell.setAttribute("role", "cell");
        cell.append(E(`crosstab_cells.${key}`, "count", "count"));
        xt.append(cell);
      }
    }

    fill("sec-emotion",
      el("div", { class: "sec-head" }, el("div", {},
        el("h2", { id: "emo-title" }, "Primary emotion, read two ways"),
        el("p", { class: "sub" }, "The model names one emotion per review. The NRC word list counts emotion words in the same title and text and takes the most frequent emotion: Tie means several emotions share the top count, None means it found no emotion words."))),
      tiles, context,
      el("div", { class: "emo-grid" },
        el("div", {}, el("p", { class: "h3" }, "How often each reader picks each emotion"),
          el("p", { class: "sub" }, "Reviews per emotion; both readers' bars share one scale."), pair),
        el("div", {}, el("p", { class: "h3" }, "Where the two readers land together"),
          el("p", { class: "sub" }, "Rows: the model's emotion. Columns: the word list's. The diagonal is the same emotion (see key); a stronger fill means more reviews."),
          el("div", { class: "xt-wrap" }, xt),
          el("div", { class: "legend", style: "margin-top:10px" },
            el("span", {}, el("span", { class: "key", style: "--c:var(--hit)" }), "Same emotion"),
            el("span", {}, el("span", { class: "key", style: "--c:var(--lex)" }), "Different")))));
    inkCells(sec);
  }

  function emoGroup(r) {
    if (r.emotion_agree) return "agree";
    if (r.nrc_emotion === "TIE") return "tie";
    if (r.nrc_emotion === "NONE") return "none";
    return "differ";
  }

  /* ---------- review table ---------- */
  function renderReviews(run) {
    const rows = run.rows;
    const hasEmo = rows.length > 0 && "nrc_emotion" in rows[0];
    const tbody = el("tbody", {});
    for (const r of rows) {
      const ok = r.prediction === r.truth;
      const hits = hasEmo && el("div", { class: "hits" }, "Word-list hits: ",
        r.nrc_hits.length ? r.nrc_hits.map(h => `${h[0]}${h[0] !== h[1] ? " → " + h[1] : ""} (${h[2].join(", ")})`).join("; ") : "none");
      const tr = el("tr", { class: ok ? "" : "is-miss", "data-review-id": r.review_id,
        "data-correct": String(ok), "data-truth": r.truth, "data-prediction": r.prediction, "data-emo": hasEmo ? emoGroup(r) : null },
        el("td", { class: "num" }, r.review_id),
        el("td", { class: "num" }, r.rating + "★"),
        el("td", {}, el("span", { class: "chip", style: `--c:${colorOf(r.truth)}` }, nice(r.truth))),
        el("td", {}, el("span", { class: "chip", style: `--c:${colorOf(r.prediction)}` }, nice(r.prediction))),
        el("td", {}, el("span", { class: "result", style: `--c:var(${ok ? "--hit" : "--miss"})` },
          el("span", { class: "mark", "aria-hidden": "true" }, ok ? "✓" : "✕"), ok ? "Match" : "Miss")),
        el("td", { class: "review" },
          el("div", { class: "clamp t" }, displayText(r.title)), el("div", { class: "clamp x" }, displayText(r.text)), hits),
        hasEmo && [
          el("td", { class: "emo" }, r.llm_emotion || "—"),
          el("td", { class: "emo" }, r.nrc_emotion === "TIE" ? ["tie", el("small", {}, r.nrc_tied.join(" / "))]
            : r.nrc_emotion === "NONE" ? "none" : r.nrc_emotion, el("small", {}, r.emotion_agree ? "same as model" : ""))]);
      tr.addEventListener("click", () => tr.classList.toggle("expanded"));
      // Search matches the stored text or its display form (entities decoded), case-insensitive.
      const hay = r.title + "\n" + r.text;
      tr._hay = hay.toLowerCase();
      tr._hayDisplay = displayText(hay).toLowerCase();
      tbody.append(tr);
    }
    const table = el("table", { id: "review-table" },
      el("thead", {}, el("tr", {}, ["ID", "Stars", "Answer key", "Model", "Result", "Title and review",
        ...(hasEmo ? ["Model emotion", "Word list"] : [])].map(h => el("th", { scope: "col" }, h)))),
      tbody);
    fill("sec-reviews",
      el("div", { class: "sec-head" },
        el("div", {},
          el("h2", { id: "reviews-title" }, "Every review, with the model's answer"),
          el("p", { class: "sub" }, "Stars decide the answer key; the model saw only the title and review text. Mistakes are tinted. Click a row to read the full review (HTML line breaks and entities in the raw text are rendered for reading).")),
        el("div", { class: "count-line", id: "row-count", "aria-live": "polite" },
          "Showing ", el("b", { id: "shown-count", "data-live-count": String(rows.length) }, rows.length.toLocaleString("en-US")),
          " of ", M(run, "n_rows", "count"), " reviews")),
      renderFilters(run),
      el("div", { class: "table-wrap" }, table, el("p", { class: "empty", id: "table-empty", hidden: "" }, "No reviews match these filters.")));
  }

  /* ---------- filters (combinable; live count) ---------- */
  function renderFilters(run) {
    const m = run.metrics;
    const opt = (value, text) => el("option", { value }, text);
    const predOptions = m.confusion_matrix.columns.filter(c => m.labels.includes(c) || m.prediction_distribution.counts[c] > 0);
    const box = el("div", { class: "filters", role: "search", "aria-label": "Filter reviews" },
      el("label", { class: "field" }, el("span", {}, "Result"),
        el("select", { id: "f-result" }, opt("all", "All"), opt("match", "Matches only"), opt("miss", "Mistakes only"))),
      el("label", { class: "field" }, el("span", {}, "Answer key (stars)"),
        el("select", { id: "f-truth" }, opt("all", "Any"), m.labels.map(l => opt(l, nice(l))))),
      el("label", { class: "field" }, el("span", {}, "Model said"),
        el("select", { id: "f-pred" }, opt("all", "Any"), predOptions.map(c => opt(c, nice(c))))),
      run.rows.length > 0 && "nrc_emotion" in run.rows[0] && el("label", { class: "field" }, el("span", {}, "Emotion readers"),
        el("select", { id: "f-emo" }, opt("all", "Any"), opt("agree", "Same emotion"), opt("differ", "Different emotion"),
          opt("tie", "Word list tie"), opt("none", "Word list found none"))),
      el("label", { class: "field grow" }, el("span", {}, "Search title and review"),
        el("input", { id: "f-search", type: "search", placeholder: "e.g. scam, balance, birthday", autocomplete: "off" })),
      el("button", { id: "f-reset", class: "reset", type: "button" }, "Reset"));
    for (const id of ["f-result", "f-truth", "f-pred", "f-emo"]) {
      const s = box.querySelector("#" + id);
      if (s) s.addEventListener("change", applyFilters);
    }
    box.querySelector("#f-search").addEventListener("input", applyFilters);
    box.querySelector("#f-reset").addEventListener("click", () => {
      for (const id of ["f-result", "f-truth", "f-pred", "f-emo"]) { const s = box.querySelector("#" + id); if (s) s.value = "all"; }
      box.querySelector("#f-search").value = "";
      applyFilters();
    });
    return box;
  }

  function applyFilters() {
    const result = $("f-result").value, truth = $("f-truth").value, pred = $("f-pred").value;
    const q = $("f-search").value.trim().toLowerCase();
    const emo = $("f-emo") ? $("f-emo").value : "all";
    let shown = 0;
    for (const tr of $("review-table").tBodies[0].rows) {
      const ok = tr.dataset.correct === "true";
      const keep = (result === "all" || (result === "match") === ok)
        && (truth === "all" || tr.dataset.truth === truth)
        && (pred === "all" || tr.dataset.prediction === pred)
        && (emo === "all" || tr.dataset.emo === emo)
        && (!q || tr._hay.includes(q) || tr._hayDisplay.includes(q));
      tr.hidden = !keep;
      if (keep) shown++;
    }
    const count = $("shown-count");
    count.textContent = shown.toLocaleString("en-US");
    count.dataset.liveCount = String(shown);
    $("table-empty").hidden = shown !== 0;
  }

  // Clicking a confusion-matrix cell shows exactly those reviews.
  function filterTo(truth, pred) {
    $("f-result").value = "all";
    if ($("f-emo")) $("f-emo").value = "all";
    $("f-truth").value = truth;
    $("f-pred").value = pred;
    $("f-search").value = "";
    applyFilters();
    $("sec-reviews").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------- method facts ---------- */
  function renderMethod(run) {
    const f = (label, ...value) => el("div", {}, el("dt", {}, label), el("dd", {}, ...value));
    fill("sec-method",
      el("div", { class: "sec-head" }, el("div", {},
        el("h2", { id: "method-title" }, "How this run was made"),
        el("p", { class: "sub" }, "Everything on this page is read from the run's saved files; nothing is typed in by hand."))),
      el("dl", { class: "facts" },
        f("Model", META(run, "model", "text", "mono")),
        f("Temperature", META(run, "temperature", "text")),
        f("Prompt file", META(run, "prompt_file", "text", "mono")),
        f("Prompt sha256", META(run, "prompt_sha256", "text", "mono")),
        f("Reviews scored", META(run, "n_rows", "count")),
        f("Selection rule", META(run, "selection_rule", "text")),
        f("Random seed", META(run, "seed", "text")),
        f("Parse failures · API errors", META(run, "parse_fail_count", "count"), " · ", META(run, "api_error_count", "count")),
        f("Dataset rows in file", META(run, "dataset_row_count", "count")),
        f("Source files", el("span", { class: "mono" }, run.sources.metrics), el("br"), el("span", { class: "mono" }, run.sources.predictions))));
  }

  /* ---------- tooltip for chart marks (hover + keyboard focus) ---------- */
  const tip = $("tip");
  function showTip(target, x, y) {
    tip.replaceChildren(el("b", {}, Number(target.dataset.value).toLocaleString("en-US")), target.dataset.label);
    const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - pad, x + pad) + "px";
    tip.style.top = Math.max(pad, y - h - pad) + "px";
    tip.classList.add("on");
  }
  document.addEventListener("pointermove", e => {
    const t = e.target.closest && e.target.closest("[data-value]");
    if (t) showTip(t, e.clientX, e.clientY); else tip.classList.remove("on");
  });
  document.addEventListener("focusin", e => {
    const t = e.target.closest && e.target.closest("[data-value]");
    if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top); }
  });
  document.addEventListener("focusout", () => tip.classList.remove("on"));
  // A click (e.g. a heatmap cell that scrolls to the table) or any scroll hides a stale tooltip.
  document.addEventListener("click", () => tip.classList.remove("on"));
  window.addEventListener("scroll", () => tip.classList.remove("on"), { passive: true });

  /* ---------- run selection ---------- */
  function selectRun(name) {
    current = DATA.runs.find(r => r.run === name) || DATA.runs[0];
    try { history.replaceState(null, "", "#run=" + current.run); } catch (_) { /* file:// in some browsers */ }
    renderTabs();
    renderBlurb(current);
    renderVerdict(current);
    renderDescribe(current);
    renderConfusion(current);
    renderClasses(current);
    renderEmotion(current);
    renderReviews(current);
    renderMethod(current);
    document.body.dataset.run = current.run;
  }

  $("page-title").textContent = DATA.title;
  document.title = DATA.title;
  const runFromHash = () => (location.hash.match(/run=([\w-]+)/) || [])[1];
  selectRun(runFromHash());
  // A shared or edited #run= link switches runs without a reload.
  window.addEventListener("hashchange", () => {
    const name = runFromHash();
    if (name && (!current || name !== current.run)) selectRun(name);
  });
  window.__dashboard = { selectRun, data: DATA };
})();
</script>
</body>
</html>
